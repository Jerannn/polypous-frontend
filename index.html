<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/img/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polypous</title>
    <script>
      (function () {
        try {
          const storedTheme = localStorage.getItem("theme");

          const systemDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          const theme =
            storedTheme === "dark" || (storedTheme === null && systemDark)
              ? "dark"
              : "light";

          document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
